# docker-compose.yml
version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: edunet-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=edunet2024
      - DOCKER_INFLUXDB_INIT_ORG=EduNetSentinel
      - DOCKER_INFLUXDB_INIT_BUCKET=network_flows
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=-otWO-2ssGBlkE-k0KaIus4e5Qtk8-rsHVyvjg9sb6glgue2XGBtGzrzTGLqAVm0hu-2Tl5BXmuaaZyvdYH4Dg==
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: edunet-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data: